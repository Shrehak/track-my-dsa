name: Full-Stack CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: track_my_dsa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d track_my_dsa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/track_my_dsa_test?schema=public
      JWT_SECRET: ci-testing-secret-key-that-is-longer-than-32-characters
      CLIENT_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client and apply migrations
        run: |
          npm --prefix server run prisma:generate
          npm --prefix server run prisma:deploy

      - name: Run backend and frontend tests
        run: npm test

      - name: Build applications
        run: npm run build
