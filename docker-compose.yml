services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: track_my_dsa
    ports:
      - "5432:5432"
    volumes:
      - track_my_dsa_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d track_my_dsa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  track_my_dsa_data:

